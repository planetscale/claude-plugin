name: Update Vendored Skills

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Capture current synced SHAs
        id: before
        run: |
          echo "database_skills_sha=$(jq -r '."database-skills".sha' .skills-versions.json)" >> "$GITHUB_OUTPUT"
          echo "skills_sha=$(jq -r '."planetscale-skills".sha' .skills-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Sync vendored skills from upstream
        run: |
          bash scripts/sync-skills.sh

      - name: Validate expected skills layout
        run: |
          test -d database-skills/skills
          for skill in mysql neki postgres vitess; do
            test -f "database-skills/skills/$skill/SKILL.md"
          done
          test -d planetscale-skills
          for skill in \
            00-safe-orchestrator \
            01-readonly-inventory \
            02-vitess-safety-review \
            03-postgres-safety-review \
            04-query-insights-and-tags \
            05-traffic-control-recommendations \
            06-webhook-automation-recommendations \
            07-schema-recommendations-agent-loop \
            08-codebase-sqlcommenter-instrumentation \
            09-mcp-agent-operating-model \
            10-customer-report-template \
            11-change-gates-and-approval-contract \
            12-best-practices-matrix \
            13-autonomous-execution-mode \
            14-pscale-cli-automation; do
            test -f "planetscale-skills/$skill/SKILL.md"
          done

      - name: Capture updated synced SHAs
        id: after
        run: |
          echo "database_skills_sha=$(jq -r '."database-skills".sha' .skills-versions.json)" >> "$GITHUB_OUTPUT"
          echo "skills_sha=$(jq -r '."planetscale-skills".sha' .skills-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Compute change metadata
        id: meta
        run: |
          DATABASE_SKILLS_BEFORE_SHA="${{ steps.before.outputs.database_skills_sha }}"
          DATABASE_SKILLS_AFTER_SHA="${{ steps.after.outputs.database_skills_sha }}"
          SKILLS_BEFORE_SHA="${{ steps.before.outputs.skills_sha }}"
          SKILLS_AFTER_SHA="${{ steps.after.outputs.skills_sha }}"
          CHANGED="false"
          if [ "$DATABASE_SKILLS_BEFORE_SHA" != "$DATABASE_SKILLS_AFTER_SHA" ] || [ "$SKILLS_BEFORE_SHA" != "$SKILLS_AFTER_SHA" ]; then
            CHANGED="true"
          fi
          # Also treat content-only drift as changed (SHA file already updated by sync script)
          if ! git diff --quiet -- database-skills planetscale-skills .skills-versions.json; then
            CHANGED="true"
          fi
          DATABASE_SKILLS_COMPARE_URL="https://github.com/planetscale/database-skills/compare/$DATABASE_SKILLS_BEFORE_SHA...$DATABASE_SKILLS_AFTER_SHA"
          SKILLS_COMPARE_URL="https://github.com/planetscale/skills/compare/$SKILLS_BEFORE_SHA...$SKILLS_AFTER_SHA"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "database_skills_before_sha=$DATABASE_SKILLS_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "database_skills_after_sha=$DATABASE_SKILLS_AFTER_SHA" >> "$GITHUB_OUTPUT"
          echo "database_skills_compare_url=$DATABASE_SKILLS_COMPARE_URL" >> "$GITHUB_OUTPUT"
          echo "skills_before_sha=$SKILLS_BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "skills_after_sha=$SKILLS_AFTER_SHA" >> "$GITHUB_OUTPUT"
          echo "skills_compare_url=$SKILLS_COMPARE_URL" >> "$GITHUB_OUTPUT"

      - name: Open pull request with vendored skill updates
        if: steps.meta.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-skills-submodules
          delete-branch: true
          title: "chore: update vendored skills"
          commit-message: "chore: update vendored skills"
          body: |
            This automated PR syncs vendored skills from upstream `main`.

            `database-skills`:
            - Previous commit: `${{ steps.meta.outputs.database_skills_before_sha }}`
            - Updated commit: `${{ steps.meta.outputs.database_skills_after_sha }}`
            - Upstream compare: ${{ steps.meta.outputs.database_skills_compare_url }}

            `planetscale-skills` (from `planetscale/skills`):
            - Previous commit: `${{ steps.meta.outputs.skills_before_sha }}`
            - Updated commit: `${{ steps.meta.outputs.skills_after_sha }}`
            - Upstream compare: ${{ steps.meta.outputs.skills_compare_url }}
          add-paths: |
            .skills-versions.json
            database-skills
            planetscale-skills
